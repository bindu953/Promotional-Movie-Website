<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="icon" type="image/png" sizes="32x32" href="./images/title_icon.jpg">
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
    <title>The Crime Brother's Crime Movie Promotional Website</title>
</head>

<body>

    <header class="header-container">
        <nav>
            <ul class="nav-bar">
                <li><a href="#Home">Home</a></li>
                <li><a href="./synopsis.html">Synopsis</a></li>
                <li><a href="#ContactUs">Contact Us</a></li>
            </ul>
        </nav>

    <main>

        <section class="hero" id="Home">

            <!-- Button Opens Video -->
            <button id="button-popup-open" aria-label="View Trailer Here">View Trailer Here</button>
            <!-- Pop-Up Background For Video-->
            <div id="background-popup" class="pop-background">
                <!-- Video and Close Button -->
                <div class="vid-content">
                    <button class="close-button" aria-label="Press Here To Close Window">&times;</button>
                    <video id="vid-popup" width="100%" controls>
                        <source src="./assets/vid/the_crime_brothers_full_trailer.mp4" type="video/mp4">
                    </video>
                </div>
            </div>

        </section>
        <footer id="ContactUs" class="footer">

            <div class="footer-container">

                <div class="footer-about">
                    <h3>The Crime Brothers</h3>
                    <p>Two kingpins. One alliance.
                        No turning back.</p>
                </div>

                <div class="footer-links">
                    <h3>Explore</h3>
                    <a href="./index.html">Home</a>
                    <a href="./synopsis.html">Synopsis</a>
                    <a href="#ContactUs">Contact</a>
                </div>

                <div class="footer-contact">
                    <h3>Get in Touch</h3>
                    <p>Contact the Production Team</p>
                    <p>
                        <i class="fa-solid fa-phone" aria-hidden="true"></i>
                        <a href="tel:+11234567890">(123) 456-7890</a>
                    </p>
                </div>

            </div>

            <p class="copyright">
                &copy; 2026 The Crime Brothers Syndicate. All rights reserved.
            </p>

        </footer>

</body>
